[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tishka", email = "alex.gromov2@mail.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "elasticsearch>=8.0.0,<9.0.0",
    "fastapi[standard]>=0.142.2",
    "pytest-asyncio>=1.4.0",
    "pytest[asyncio]>=9.1.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
testovoe = "app:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
